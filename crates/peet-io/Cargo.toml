[package]
name = "peet-io"
description = "PeetCAD file formats: the native .peet format and STL export (DXF and STEP later)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
peet-math.workspace = true
peet-kernel.workspace = true
peet-model.workspace = true
serde.workspace = true
postcard.workspace = true
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ron = "0.12"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
