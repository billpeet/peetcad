[package]
name = "peet-ui"
description = "PeetCAD application shell: panels, commands, viewport interaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
peet-math.workspace = true
peet-platform.workspace = true
peet-render.workspace = true
peet-sketch.workspace = true
peet-kernel.workspace = true
peet-model.workspace = true
peet-document.workspace = true
peet-ops.workspace = true
serde_json.workspace = true
peet-sheetmetal.workspace = true
peet-io.workspace = true
eframe = { workspace = true, features = ["wgpu", "persistence"] }
egui.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# What tells an open assembly that a linked part's file changed. Desktop only: the
# browser has no files to watch.
notify = "8"
# The socket peet reaches a running session through.
peet-live.workspace = true

[dev-dependencies]
# Drives the sketch editor with simulated mouse input in tests (no GPU needed).
egui_kittest = "0.36"

[lints]
workspace = true
