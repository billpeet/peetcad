<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="PeetCAD: a lightweight parametric CAD application, with sheet metal first." />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1d22" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f6" />
    <title>PeetCAD</title>

    <!-- Trunk: build the peetcad binary for wasm32, optimise it for size, copy the icon. -->
    <link data-trunk rel="rust" data-bin="peetcad" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" />
    <link data-trunk rel="icon" href="assets/icon.svg" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1d22;
            color: #d8dbe2;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        @media (prefers-color-scheme: light) {
            html, body { background: #f3f4f6; color: #2a2d34; }
        }
        /* eframe sizes the canvas; it must fill the page and never scroll. */
        #peetcad_canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
        }
        #status {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            font-size: 15px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(120, 170, 240, 0.25);
            border-top-color: rgb(120, 170, 240);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="peetcad_canvas"></canvas>
    <div id="status">
        <div class="spinner"></div>
        <p>Loading PeetCAD…</p>
        <noscript><p>PeetCAD needs JavaScript and WebAssembly.</p></noscript>
    </div>
</body>
</html>
