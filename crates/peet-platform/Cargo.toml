[package]
name = "peet-platform"
description = "Thin platform abstraction (time, storage locations, crash reports) for native and web builds of PeetCAD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
log.workspace = true
web-time.workspace = true


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native save dialog (MIT). Uses the system dialog: COM on Windows.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlElement", "Url", "Window"] }
wasm-bindgen = "0.2"

[lints]
workspace = true
